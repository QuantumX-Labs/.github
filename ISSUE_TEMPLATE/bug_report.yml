name: Bug Report
description: Report a bug or unexpected behaviour in a QuantumX Labs project.
title: "[BUG]: "
labels:
  - bug
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve QuantumX Labs!
        Please provide accurate details so we can investigate and resolve the issue.

  - type: textarea
    id: bug_description
    attributes:
      label: Bug Description
      description: Clearly describe the bug you encountered.
      placeholder: Explain what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Provide the steps required to reproduce this issue.
      placeholder: |
        1. Navigate to...
        2. Execute...
        3. Observe the error...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
      placeholder: Describe the expected result...
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behaviour
      description: What actually happened?
      placeholder: Describe the actual result...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Logs
      description: Attach screenshots, error messages, or relevant logs.
      placeholder: Add supporting evidence if available.
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Specify your operating system, browser, or runtime environment.
      placeholder: "e.g. Windows 11, Python 3.13, Chrome 142"
    validations:
      required: true

  - type: input
    id: project_version
    attributes:
      label: Project Version
      description: Specify the affected version, release, or commit hash.
      placeholder: "e.g. v1.0.0 or commit hash"
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Bug Severity
      description: How significantly does this issue affect the project?
      options:
        - Critical - Application or major functionality is unusable
        - High - Important functionality is broken
        - Medium - Functionality is partially affected
        - Low - Minor issue or cosmetic problem
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Verification
      description: Please confirm the following before submitting.
      options:
        - label: I have searched existing issues for duplicates.
          required: true
        - label: I have provided sufficient information to reproduce the issue.
          required: true
        - label: I am reporting this issue in the correct repository.
          required: true
